services:
  nginx:
    image: nginx:alpine
    container_name: smart_reader_proxy
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart_reader_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartreader
      POSTGRES_PASSWORD: smartreader_password
      POSTGRES_DB: smartreader_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: smart_reader_s3
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0"
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed_data:/data

volumes:
  pg_data:
  seaweed_data:
